name: Update EasyTier Lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update easytier in Cargo.lock
        run: |
          command -v cargo >/dev/null 2>&1 || (curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal && . "$HOME/.cargo/env")
          cd rust
          cargo update -p easytier
          if grep -q '#8e1d0791421e95dd73533db07463b3afa08495ae' Cargo.lock; then
            echo 'easytier pin unchanged after cargo update, retrying with --precise'
            cargo update -p easytier --precise e307dadb4812fc42a43e4e7f210f11ffa980e02e || true
          fi
          if grep -q '#8e1d0791421e95dd73533db07463b3afa08495ae' Cargo.lock; then
            echo 'ERROR: easytier pin still points at the old commit'
            exit 1
          fi
          grep -n 'EasyTier.git#' Cargo.lock || true

      - name: Commit and push Cargo.lock
        run: |
          git config user.name "Lanliy-Okami"
          git config user.email "345453228+Lanliy-Okami@users.noreply.github.com"
          git add rust/Cargo.lock
          if git diff --cached --quiet; then
            echo "No lock changes to commit"
          else
            git commit -m "chore(deps): bump EasyTier to latest main"
            git push
          fi