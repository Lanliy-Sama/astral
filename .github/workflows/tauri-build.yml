name: Tauri Build

# Dedicated CI rail for the Tauri port. A registration copy also lives on main
# (workflow_dispatch by filename requires it); every checkout targets the Tauri
# branch, where tauri-app/ exists.
on:
  workflow_dispatch:
  push:
    branches: [Tauri]
    paths:
      - 'tauri-app/**'
      - '.github/workflows/tauri-build.yml'

concurrency:
  group: tauri-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Tauri app (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: tauri-app
    steps:
      - name: Checkout (Tauri branch)
        uses: actions/checkout@v4
        with:
          ref: Tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -qqy libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup protoc (easytier dependency)
        uses: arduino/setup-protoc@v3
        with:
          version: '35.1'
          repo-token: ${{ github.token }}

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.95'
          cache: false

      - name: Stage PNG icon from Flutter logo
        run: mkdir -p src-tauri/icons && cp public/logo.png src-tauri/icons/icon.png

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app (frontend + Rust + bundle)
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          RUSTFLAGS: "--cap-lints=warn"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ matrix.os }}
          path: tauri-app/src-tauri/target/release/bundle/**
          if-no-files-found: error
