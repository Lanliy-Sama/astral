name: 🧊 构建 Tauri 应用

on:
  workflow_dispatch:
  push:
    branches:
      - Tauri

permissions:
  contents: write

jobs:
  # Fast checks that need no Rust toolchain.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 安装依赖
        working-directory: tauri-app
        run: npm install --no-audit --no-fund

      - name: 🏗️ 构建前端
        working-directory: tauri-app
        run: npm run build

      - name: 📤 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: astral-tauri-frontend
          path: tauri-app/dist/
          if-no-files-found: warn

  # The shipped build: one Windows installer with the real EasyTier core linked.
  # rust_lib_astral is built with default-features = false, so the Flutter-only
  # flutter_rust_bridge layer and frb_generated.rs are not compiled at all.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🦀 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🦀 Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './tauri-app/src-tauri -> target'

      - name: 📦 安装 protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 安装 Npcap SDK（Packet.lib / wpcap.lib）
        run: |
          $sdkVer = "1.16"
          $zip = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          $dst = Join-Path $env:GITHUB_WORKSPACE "third_party/npcap-sdk"
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-$sdkVer.zip" -OutFile $zip
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dst -Force

          $libDir = Join-Path $dst "Lib\x64"
          if (!(Test-Path (Join-Path $libDir "Packet.lib"))) { throw "Packet.lib missing in $libDir" }
          if (!(Test-Path (Join-Path $libDir "wpcap.lib"))) { throw "wpcap.lib missing in $libDir" }

          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "LIB=$libDir;$env:LIB`n", $utf8NoBom)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "NPCAP_SDK_LIB=$libDir`n", $utf8NoBom)
          Write-Host "Npcap SDK at $libDir"
        shell: pwsh

      - name: 📦 安装前端依赖
        working-directory: tauri-app
        run: npm install --no-audit --no-fund

      - name: 🧊 构建并打包（真实 EasyTier 后端）
        working-directory: tauri-app
        shell: pwsh
        env:
          NPCAP_SDK_LIB: ${{ github.workspace }}\third_party\npcap-sdk\Lib\x64
        run: |
          npx tauri build --features real-backend 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE\build.log"
          exit $LASTEXITCODE

      - name: 📤 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: astral-tauri-windows
          path: |
            tauri-app/src-tauri/target/release/bundle/**/*.exe
            tauri-app/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: warn

      - name: 📤 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
