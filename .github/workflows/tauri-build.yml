name: Tauri Build

# Dedicated CI rail for the Tauri port. A registration copy also lives on main
# (workflow_dispatch by filename requires it); every checkout targets the Tauri
# branch, where tauri-app/ exists.
on:
  workflow_dispatch:
  push:
    branches: [Tauri]
    paths:
      - 'tauri-app/**'
      - '.github/workflows/tauri-build.yml'

concurrency:
  group: tauri-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Tauri app (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: tauri-app
    steps:
      - name: Checkout (Tauri branch)
        uses: actions/checkout@v4
        with:
          ref: Tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -qqy libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup protoc (easytier dependency)
        uses: arduino/setup-protoc@v3
        with:
          version: '35.1'
          repo-token: ${{ github.token }}

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.95'
          cache: false

      - name: Stage PNG icon from Flutter logo
        run: mkdir -p src-tauri/icons && cp public/logo.png src-tauri/icons/icon.png

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app (frontend + Rust + bundle)
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          RUSTFLAGS: "--cap-lints=warn"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ matrix.os }}
          path: tauri-app/src-tauri/target/release/bundle/**
          if-no-files-found: error

  build-android:
    name: Build Tauri app (android)
    timeout-minutes: 90
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: tauri-app
    steps:
      - name: Checkout (Tauri branch)
        uses: actions/checkout@v4
        with:
          ref: Tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qqy libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK 预装于 runner（ANDROID_HOME 已设）；android-actions/setup-android@v3
      # 会安装已废弃的 'tools' 包导致 "Failed to find package 'tools'" 速死，故不用该 action
      - name: Resolve preinstalled sdkmanager
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1); fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install NDK and platform components
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup protoc (easytier dependency)
        uses: arduino/setup-protoc@v3
        with:
          version: '35.1'
          repo-token: ${{ github.token }}

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.95'
          cache: false

      - name: Add Android Rust target (arm64)
        run: rustup target add aarch64-linux-android

      - name: Stage PNG icon from Flutter logo
        run: mkdir -p src-tauri/icons && cp public/logo.png src-tauri/icons/icon.png

      - name: Install frontend dependencies
        run: pnpm install

      - name: Init Android project
        run: pnpm tauri android init

      - name: Build Android APK (arm64, debug-signed)
        # TODO(release-signing): 接入正式签名密钥（secrets）后切 release 构建
        run: pnpm tauri android build --apk --debug --target aarch64
        env:
          RUSTFLAGS: "--cap-lints=warn"

      - name: Locate APK outputs
        if: always()
        run: find src-tauri/gen/android -name "*.apk" || true

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-android
          path: tauri-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
